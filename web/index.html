  <script>
    // MutationObserver to hide loading container when Flutter loads
    const observer = new MutationObserver(function(mutations) {
      for (const mutation of mutations) {
        if (mutation.addedNodes.length > 0) {
          for (let i = 0; i < mutation.addedNodes.length; i++) {
            const node = mutation.addedNodes[i];
            if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'FLT-GLASS-PANE') {
              const skeleton = document.getElementById('loading-container');
              if (skeleton) {
                skeleton.style.opacity = '0';
                setTimeout(() => skeleton.remove(), 250);
              }
              observer.disconnect();
              return;
            }
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    window._onFlutterAppLoaded = function() {
      const skeleton = document.getElementById('loading-container');
      if (skeleton) {
        skeleton.style.opacity = '0';
        setTimeout(() => skeleton.remove(), 250);
      }
    };
  </script>
